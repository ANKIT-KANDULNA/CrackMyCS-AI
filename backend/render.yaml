services:
  - type: web
    name: crack-my-cs-ai-backend
    env: python
    buildCommand: export CARGO_HOME=/tmp/.cargo && pip install --legacy-peer-deps -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.13
      - key: PORT
        value: 8000
      - key: GROQ_API_KEY
        sync: false
      - key: PINECONE_API_KEY
        sync: false
      - key: JWT_SECRET_KEY
        sync: false
      - key: AUTH_CALLBACK_SECRET
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      # WARNING: DATABASE_URL MUST be set to a persistent PostgreSQL connection string
      # in production (e.g. Render Postgres). If unset, the backend falls back to
      # local SQLite on ephemeral disk — all users and chat history will be lost
      # on every deploy or restart.
      - key: DATABASE_URL
        sync: false
